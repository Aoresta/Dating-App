name: Build Amour APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: amour/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        working-directory: amour
        run: npm ci

      - name: Build web assets
        working-directory: amour
        run: npm run build

      - name: Sync Capacitor
        working-directory: amour
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: amour/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: amour/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp amour/android/app/build/outputs/apk/release/app-release-unsigned.apk \
             amour-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amour-release-apk
          path: amour-release.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: amour-release.apk
